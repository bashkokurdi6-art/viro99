<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تۆمارکردن - VIRO GAME</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: #131c31;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h2 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: none;
      background: #1b2540;
      color: white;
      outline: none;
      font-size: 16px;
    }

    input::placeholder {
      color: #aaa;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #ffd700;
      color: black;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }

    .link {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }

    .link a {
      color: #ffd700;
      text-decoration: none;
    }

    .message {
      text-align: center;
      margin-top: 14px;
      min-height: 24px;
      font-size: 15px;
      color: #ff6b6b;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>تۆمارکردن</h2>

    <input type="text" id="username" placeholder="ناوی بەکارهێنەر">
    <input type="email" id="email" placeholder="ئیمەیڵ">
    <input type="password" id="password" placeholder="وشەی نهێنی">

    <button class="btn" onclick="register()">تۆمارکردن</button>

    <div class="message" id="message"></div>

    <div class="link">
      هەژمارت هەیە؟ <a href="login.html">چوونە ژوورەوە</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://ukwucohcasssslcdvzds.supabase.co';
    const supabaseKey = 'sb_publishable_WPa170xGe956IfF9qeIxPQ_Wl6uEbnk';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function register() {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      message.style.color = "#ff6b6b";
      message.textContent = "";

      if (!username || !email || !password) {
        message.textContent = "تکایە هەموو خانەکان پڕ بکە";
        return;
      }

      if (password.length < 6) {
        message.textContent = "وشەی نهێنی دەبێت لانیکەم 6 پیت بێت";
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            username: username
          }
        }
      });

      if (error) {
        message.textContent = "هەڵە: " + error.message;
        console.log(error);
      } else {
        message.style.color = "#00ff99";
        message.textContent = "تۆمارکردن سەرکەوتوو بوو";

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);
      }
    }
  </script>

</body>
</html>
