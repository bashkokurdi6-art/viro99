<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تۆمارکردن</title>

  <style>
    body {
      background: #0b1020;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: #131c31;
      padding: 20px;
      border-radius: 16px;
    }

    h2 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: none;
      background: #1b2540;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #ffd700;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    #msg {
      margin-top: 12px;
      text-align: center;
      min-height: 24px;
      color: #ff6b6b;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>تۆمارکردن</h2>

    <input type="email" id="email" placeholder="ئیمەیڵ">
    <input type="password" id="password" placeholder="وشەی نهێنی">

    <button onclick="register()">تۆمارکردن</button>

    <div id="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseUrl = 'https://ukwucohcasssslcdvzds.supabase.co';
    const supabaseKey = 'sb_publishable_WPa170xGe956IfF9qeIxPQ_Wl6uEbnk';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    function show(text, color = '#ff6b6b') {
      const msg = document.getElementById("msg");
      msg.style.color = color;
      msg.textContent = text;
    }

    async function register() {
      show("تاقیکردنەوە...");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!email || !password) {
        show("تکایە هەموو خانەکان پڕ بکە");
        return;
      }

      try {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password
        });

        if (error) {
          show("هەڵە: " + error.message);
          console.log(error);
          return;
        }

        show("تۆمارکردن سەرکەوتوو بوو", "#00ff99");
        console.log(data);

      } catch (err) {
        console.log(err);
        show("کێشەیەکی سیستەم هەیە");
      }
    }
  </script>

</body>
</html>
