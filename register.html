<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<style>
body{background:#0b1020;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif}
.card{width:320px;padding:20px;background:#111;border-radius:15px;text-align:center}
input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none}
button{width:100%;padding:10px;background:gold;border:none;border-radius:8px;font-weight:bold}
</style>
</head>

<body>
<div class="card">
<h2>REGISTER</h2>
<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="register()">Register</button>
<p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRjONj2ubnjWRcAudc75XyICh8KXwrX5I",
  authDomain: "viro-bdcc2.firebaseapp.com",
  projectId: "viro-bdcc2",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.register = async () => {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;
  const msg = document.getElementById("msg");

  try {
    const user = await createUserWithEmailAndPassword(auth, email, pass);

    await setDoc(doc(db, "users", user.user.uid), {
      username: name,
      userId: "VIRO-" + Math.floor(1000 + Math.random()*9000),
      balance: 100,
      points: 1000
    });

    msg.innerText = "Success ✅";
    setTimeout(()=>location.href="login.html",1000);

  } catch(e){
    msg.innerText = e.code;
  }
}
</script>
</body>
</html>
