<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تۆمارکردن - VIRO GAME</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: #131c31;
      padding: 22px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h2 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 20px;
      font-size: 22px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      background: #f4f6fb;
      color: #111827;
      font-size: 16px;
    }

    input::placeholder {
      color: #6b7280;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #ffd700;
      color: #111;
      border: none;
      border-radius: 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 17px;
      transition: 0.2s;
    }

    .btn:hover {
      opacity: 0.92;
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 12px;
      text-align: center;
      font-size: 15px;
      min-height: 24px;
      font-weight: bold;
    }

    .success {
      color: #22c55e;
    }

    .error {
      color: #ff6b6b;
    }

    .link {
      text-align: center;
      margin-top: 14px;
      font-size: 15px;
    }

    .link a {
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>تۆمارکردن</h2>

    <input type="text" id="name" placeholder="ناو">
    <input type="text" id="phone" placeholder="ژمارەی مۆبایل">
    <input type="password" id="password" placeholder="وشەی نهێنی">

    <button class="btn" id="registerBtn" onclick="registerUser()">تۆمارکردن</button>

    <div id="message" class="msg"></div>

    <div class="link">
      هەژمارت هەیە؟ <a href="login.html">چوونە ژوورەوە</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://hqxndpyllgkifhzffsma.supabase.co";
    const SUPABASE_KEY = "sb_publishable_wbD4aaN5Dn5tpekvEZkF1g_PCF9Ra2z";

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showMessage(text, type) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = "msg " + type;
    }

    async function registerUser() {
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value.trim();
      const btn = document.getElementById("registerBtn");

      if (!name || !phone || !password) {
        showMessage("تکایە هەموو خانەکان پڕ بکەوە", "error");
        return;
      }

      if (password.length < 6) {
        showMessage("وشەی نهێنی دەبێت لانیکەم 6 پیت بێت", "error");
        return;
      }

      const cleanPhone = phone.replace(/[^0-9]/g, "");

      if (cleanPhone.length < 8) {
        showMessage("ژمارەی مۆبایل دروست نیە", "error");
        return;
      }

      const fakeEmail = cleanPhone + "@virogame.com";

      btn.disabled = true;
      btn.textContent = "چاوەڕوان بە...";

      try {
        const { data, error } = await client.auth.signUp({
          email: fakeEmail,
          password: password,
          options: {
            data: {
              full_name: name,
              phone: cleanPhone
            }
          }
        });

        if (error) {
          showMessage(error.message, "error");
          btn.disabled = false;
          btn.textContent = "تۆمارکردن";
          return;
        }

        showMessage("تۆمارکردن سەرکەوتوو بوو", "success");

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1500);

      } catch (err) {
        showMessage("هەڵەیەک ڕوویدا", "error");
        btn.disabled = false;
        btn.textContent = "تۆمارکردن";
      }
    }
  </script>

</body>
</html>
