<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چوونە ژوورەوە</title>
  <style>
    body{
      background:#0b1020;
      color:white;
      font-family:Arial,sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      margin:0;
    }
    .box{
      width:90%;
      max-width:400px;
      background:#131c31;
      padding:20px;
      border-radius:16px;
    }
    h2{
      text-align:center;
      color:#ffd700;
      margin-bottom:20px;
    }
    input{
      width:100%;
      padding:12px;
      margin-bottom:12px;
      border:none;
      border-radius:10px;
      background:#1b2540;
      color:white;
      box-sizing:border-box;
    }
    .btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      background:#ffd700;
      color:black;
      font-weight:bold;
      cursor:pointer;
    }
    #message{
      margin-top:12px;
      text-align:center;
      min-height:24px;
      color:#ff6b6b;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>چوونە ژوورەوە</h2>

    <input type="email" id="email" placeholder="ئیمەیڵ">
    <input type="password" id="password" placeholder="وشەی نهێنی">

    <button type="button" class="btn" onclick="login()">چوونە ژوورەوە</button>

    <div id="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://ukwucohcasssslcdvzds.supabase.co';
    const supabaseKey = 'sb_publishable_WPa170xGe956IfF9qeIxPQ_Wl6uEbnk';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    function showMessage(text, color = '#ff6b6b') {
      const message = document.getElementById('message');
      message.style.color = color;
      message.textContent = text;
    }

    async function login() {
      showMessage('تاقیکردنەوە...');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!email || !password) {
        showMessage('تکایە ئیمەیڵ و وشەی نهێنی پڕ بکە');
        return;
      }

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          showMessage('هەڵە: ' + error.message);
          console.log(error);
          return;
        }

        showMessage('بە سەرکەوتوویی چوویتە ژوورەوە', '#00ff99');
        console.log(data);

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);

      } catch (err) {
        console.log(err);
        showMessage('JavaScript هەڵەیەک هەیە');
      }
    }
  </script>

</body>
</html>
