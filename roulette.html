<!DOCTYPE html>
<html>
<head>
<title>VIRO99 Roulette</title>
<style>
body{
background:#07111d;
color:white;
font-family:Arial;
text-align:center;
padding:40px;
}

.wheel{
width:260px;
height:260px;
border-radius:50%;
margin:auto;
background:conic-gradient(red 0 50%,black 50% 100%);
border:10px solid gold;
transition:4s;
}

button{
padding:15px 30px;
border:none;
border-radius:10px;
background:limegreen;
font-size:18px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
}
</style>
</head>

<body>

<h1>🎰 VIRO99 Roulette</h1>

<div class="wheel" id="wheel"></div>

<button onclick="spin()">SPIN</button>

<h2 id="result"></h2>

<script>
let deg=0;

function spin(){

deg+=1440+Math.random()*720

document.getElementById("wheel").style.transform="rotate("+deg+"deg)"

let r=Math.random()

setTimeout(()=>{

if(r<0.5){
document.getElementById("result").innerText="RED WIN"
}else{
document.getElementById("result").innerText="BLACK WIN"
}

},4000)

}
</script>

</body>
</html>
