<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سیواک - حەج و عومرە</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&display=swap');

body{
  margin:0;
  font-family:'Noto Sans Arabic', sans-serif;
  color:white;

  /* BACKGROUND */
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
  url("https://images.unsplash.com/photo-1584551246679-0daf3d275d0f") no-repeat center center/cover;
}

/* HEADER */
header{
  text-align:center;
  padding:25px;
  font-size:24px;
  font-weight:bold;
}

/* CARD */
.card{
  background:rgba(0,0,0,0.6);
  margin:15px;
  padding:20px;
  border-radius:15px;
  backdrop-filter:blur(6px);
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  background:#16a34a;
  border:none;
  border-radius:10px;
  color:white;
  margin-top:10px;
  font-size:16px;
}
</style>
</head>

<body>

<header>🕋 سیواک - حەج و عومرە</header>

<div class="card">
<h3>📖 زانیاری حەج</h3>
<p>هەموو هەنگاوەکانی حەج بە شێوەیەکی سادە.</p>
<button>بینین</button>
</div>

<div class="card">
<h3>🕌 مزگەوتی نەبەوی</h3>
<p>زانیاری لەسەر مزگەوتی پیرۆزی مەدینە.</p>
<button>بینین</button>
</div>

<div class="card">
<h3>💰 ئۆفەرەکان</h3>
<p>باشترین نرخەکانی حەج و عومرە.</p>
<button>بینین</button>
</div>

<div class="card">
<h3>📩 حجزکردن</h3>
<p>داواکاری خۆت بنێرە.</p>
<button>حجز بکە</button>
</div>

</body>
</html>
