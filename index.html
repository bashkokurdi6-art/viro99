<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
</head>

<body style="background:#0b1020;color:white;text-align:center">

<h1 id="name">Loading...</h1>
<p id="id"></p>
<p id="balance"></p>
<p id="points"></p>

<button onclick="logout()">Logout</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRjONj2ubnjWRcAudc75XyICh8KXwrX5I",
  authDomain: "viro-bdcc2.firebaseapp.com",
  projectId: "viro-bdcc2",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    location.href = "login.html";
    return;
  }

  const snap = await getDoc(doc(db, "users", user.uid));

  if (snap.exists()) {
    const data = snap.data();

    document.getElementById("name").innerText = data.username;
    document.getElementById("id").innerText = data.userId;
    document.getElementById("balance").innerText = "Balance: $" + data.balance;
    document.getElementById("points").innerText = "Points: " + data.points;
  }

});

window.logout = () => {
  signOut(auth);
  location.href="login.html";
}
</script>
</body>
</html>
