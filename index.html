<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Siwak Hajj & Umrah</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

header{
  background:#020617;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

.section{
  padding:15px;
}

.card{
  background:#111827;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
}

input, textarea, select{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin-top:12px;
  background:#2563eb;
  color:white;
  border:none;
  border-radius:8px;
  font-size:16px;
}

h3{
  margin-top:0;
}
#status{
  text-align:center;
  margin-top:10px;
  color:#22c55e;
}
.offer{
  background:#1f2937;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
🕋 Siwak Hajj & Umrah
</header>

<div class="section">

<div class="card">
<h3>📖 About Hajj</h3>
<p>Learn rituals and steps of Hajj and Umrah.</p>
</div>

<div class="card">
<h3>🕌 Masjid Nabawi</h3>
<p>Information about the holy mosque in Medina.</p>
</div>

<!-- OFFERS -->
<div class="card">
<h3>💰 Latest Offers</h3>
<div id="offers">Loading...</div>
</div>

<!-- UPLOAD -->
<div class="card">
<h3>🖼️ Upload Visa / Passport</h3>

<input type="file" id="file">
<button onclick="upload()">Upload Image</button>

<p id="status"></p>
</div>

<!-- BOOKING FORM -->
<div class="card">
<h3>📩 Booking</h3>

<form action="https://formspree.io/f/mgorjdjr" method="POST">

<input type="text" name="name" placeholder="Full Name" required>

<input type="tel" name="phone" placeholder="Phone Number" required>

<input type="email" name="email" placeholder="Email" required>

<select name="type" required>
<option value="">Select Package</option>
<option>Umrah</option>
<option>Hajj</option>
</select>

<input type="date" name="date" required>

<textarea name="message" placeholder="Notes"></textarea>

<input type="hidden" name="fileLink" id="fileLink">

<button type="submit">Send Booking</button>

</form>

</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
  storageBucket: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// LOAD OFFERS
const offersDiv = document.getElementById("offers");
offersDiv.innerHTML = "";

const querySnapshot = await getDocs(collection(db, "offers"));
querySnapshot.forEach((doc) => {
  const data = doc.data();

  offersDiv.innerHTML += `
    <div class="offer">
      <h4>${data.title}</h4>
      <p>Price: ${data.price}$</p>
    </div>
  `;
});

// UPLOAD IMAGE
window.upload = async function(){
  const file = document.getElementById("file").files[0];

  if(!file){
    alert("Select image first");
    return;
  }

  document.getElementById("status").innerText = "Uploading...";

  const storageRef = ref(storage, "visas/" + Date.now() + "_" + file.name);

  await uploadBytes(storageRef, file);

  const url = await getDownloadURL(storageRef);

  document.getElementById("fileLink").value = url;

  document.getElementById("status").innerText = "Uploaded ✅";
};
</script>

<!-- SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
