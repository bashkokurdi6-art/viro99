<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Siwak Hajj & Umrah</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
body {
  margin:0;
  font-family: Arial;
  background:#f5f5f5;
}

header {
  background:#0f172a;
  color:white;
  padding:15px;
  text-align:center;
}

.section { padding:15px; }

.card {
  background:white;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

input, textarea {
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  background:#0f172a;
  color:white;
  padding:10px;
  border:none;
  border-radius:8px;
  width:100%;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
<h2>🕋 Siwak Hajj & Umrah</h2>
</header>

<div class="section">

<div class="card">
<h3>📖 About Hajj</h3>
<p>Learn rituals and steps of Hajj and Umrah.</p>
</div>

<div class="card">
<h3>🕌 Masjid Nabawi</h3>
<p>Visit and learn about the holy mosque in Medina.</p>
</div>

<!-- OFFERS -->
<div class="card">
<h3>💰 Latest Offers</h3>
<div id="offers"></div>
</div>

<!-- BOOKING FORM -->
<div class="card">
<h3>📩 Book Now</h3>

<form action="https://formspree.io/f/maqagloq" method="POST">

<input type="text" name="name" placeholder="Full Name" required>
<input type="email" name="email" placeholder="Email" required>
<textarea name="message" placeholder="Your request..." required></textarea>

<input type="hidden" name="_subject" value="New Booking!">

<button>Send Request</button>

</form>
</div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "XXXX",
  authDomain: "XXXX",
  projectId: "XXXX",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const offersDiv = document.getElementById("offers");

const querySnapshot = await getDocs(collection(db, "offers"));
querySnapshot.forEach((doc) => {
  const data = doc.data();

  offersDiv.innerHTML += `
    <div style="background:#eee;padding:10px;margin-top:10px;border-radius:8px">
      <h4>${data.title}</h4>
      <p>Price: ${data.price}$</p>
    </div>
  `;
});
</script>

<!-- SERVICE WORKER -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
