<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIRO GAME</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
    body{background:#0b1020;color:#fff}

    header{
      background:#11182d;
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
      position:sticky;
      top:0;
      z-index:999;
    }

    .logo{font-size:24px;color:#ffd700;font-weight:bold}

    nav{
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .btn{
      background:#ffd700;
      border:none;
      border-radius:12px;
      padding:12px;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-dark{
      background:#1d2742;
      color:#fff;
    }

    .user-box{
      background:#1b2540;
      padding:10px 14px;
      border-radius:12px;
      font-size:14px;
      text-align:center;
      width:100%;
    }

    .hero{text-align:center;padding:20px}
    .hero h1{color:#ffd700}

    .container{padding:14px;max-width:500px;margin:auto}

    .section-title{
      color:#ffd700;
      margin-bottom:10px;
    }

    .dashboard-box,.card{
      background:#131c31;
      padding:14px;
      border-radius:14px;
      margin-bottom:10px;
    }

    .promo-banner{
      width:100%;
      height:150px;
      object-fit:cover;
      border-radius:10px;
    }

    footer{
      text-align:center;
      padding:15px;
      background:#11182d;
      margin-top:20px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">VIRO GAME</div>

  <!-- 👇 user info -->
  <div class="user-box" id="userBox">میوان</div>

  <nav id="navButtons">
    <a href="register.html"><button class="btn">تۆمارکردن</button></a>
    <a href="login.html"><button class="btn btn-dark">چوونە ژوورەوە</button></a>
  </nav>

  <!-- 👇 logout -->
  <button class="btn btn-dark" id="logoutBtn" style="display:none">چوونە دەرەوە</button>
</header>

<section class="hero">
  <h1>VIRO GAME PUBG</h1>
  <p>پلاتفۆرمی PUBG بۆ تۆڕنۆمێنت و پۆینت</p>
</section>

<div class="container">

  <h2 class="section-title">داشبۆرد</h2>

  <div class="dashboard-box">
    <img class="promo-banner" src="https://images.unsplash.com/photo-1542751371-adc38448a05e">
    <p>ڕێکلام / تیم</p>
  </div>

  <div class="dashboard-box">
    <p>ئۆفەر 1</p>
    <p>ئۆفەر 2</p>
  </div>

  <h2 class="section-title">PUBG</h2>

  <div class="card">
    <h3>PUBG Match</h3>
    <p>64 Player</p>
  </div>

</div>

<footer>
VIRO GAME © 2026
</footer>

<script>
  const userEmail = localStorage.getItem("userEmail");
  const userBox = document.getElementById("userBox");
  const nav = document.getElementById("navButtons");
  const logoutBtn = document.getElementById("logoutBtn");

  if (userEmail) {
    userBox.textContent = userEmail;

    // hide login/register
    nav.style.display = "none";

    // show logout
    logoutBtn.style.display = "block";
  } else {
    userBox.textContent = "میوان";
  }

  logoutBtn.onclick = () => {
    localStorage.removeItem("userEmail");
    window.location.href = "login.html";
  };
</script>

</body>
</html>
