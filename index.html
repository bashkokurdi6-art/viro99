<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIRO GAME</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      line-height: 1.6;
    }

    header {
      background: #11182d;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: #ffd700;
      color: black;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-dark {
      background: #1d2742;
      color: white;
    }

    .hero {
      padding: 50px 20px;
      text-align: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 15px;
      color: #ffd700;
    }

    .hero p {
      max-width: 800px;
      margin: auto;
      color: #d1d5db;
      font-size: 18px;
    }

    .container {
      width: 92%;
      max-width: 1300px;
      margin: 30px auto;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 20px;
      color: #ffd700;
      border-right: 5px solid #ffd700;
      padding-right: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 20px;
    }

    .card {
      background: #131c31;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .live-badge {
      display: inline-block;
      background: red;
      color: white;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .player-list {
      list-style: none;
      margin-top: 10px;
    }

    .player-list li {
      padding: 10px 12px;
      background: #1b2540;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status {
      color: #00ff99;
      font-size: 14px;
      font-weight: bold;
    }

    .point-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .point-package {
      background: #1b2540;
      padding: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .dashboard-box {
      background: #131c31;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .promo-banner {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .offer-item {
      background: #1b2540;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    footer {
      margin-top: 50px;
      text-align: center;
      padding: 20px;
      background: #11182d;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">VIRO GAME</div>
  <nav>
    <button class="btn">تۆمارکردن</button>
    <button class="btn btn-dark">چوونە ژوورەوە</button>
  </nav>
</header>

<section class="hero">
  <h1>VIRO GAME PUBG</h1>
</section>

<div class="container">

<section>
  <h2 class="section-title">داشبۆرد</h2>
  <div class="dashboard-grid">

    <div class="dashboard-box">
      <img class="promo-banner" src="https://images.unsplash.com/photo-1542751371-adc38448a05e">
      <p>شوێنی ڕێکلام / تیم</p>
    </div>

    <div class="dashboard-box">
      <div class="offer-item">ئۆفەر 1</div>
      <div class="offer-item">ئۆفەر 2</div>
    </div>

  </div>
</section>

<section>
  <h2 class="section-title">PUBG Tournament</h2>
  <div class="card">
    <span class="live-badge">LIVE</span>
    <h3>PUBG Match</h3>
    <p>64 Player</p>
  </div>
</section>

<section>
  <h2 class="section-title">Players</h2>
  <ul class="player-list">
    <li>Player 1 <span class="status">Online</span></li>
    <li>Player 2 <span class="status">Online</span></li>
  </ul>
</section>

<section>
  <h2 class="section-title">Points</h2>
  <div class="point-box">
    <div class="point-package">
      1000 Point <button class="btn">Buy</button>
    </div>
  </div>
</section>

</div>

<footer>
VIRO GAME © 2026
</footer>

</body>
</html>
