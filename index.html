<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIRO GAME</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: #ffffff;
      line-height: 1.6;
    }

    header {
      background: #11182d;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
      text-align: center;
    }

    nav {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      background: #ffd700;
      color: #000;
      padding: 12px 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      width: 100%;
    }

    .btn-dark {
      background: #1d2742;
      color: #fff;
    }

    .hero {
      padding: 24px 14px 18px;
      text-align: center;
      background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    .hero h1 {
      font-size: 28px;
      color: #ffd700;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 14px;
      color: #d1d5db;
      max-width: 500px;
      margin: auto;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 14px;
    }

    section {
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 12px;
      color: #ffd700;
      border-right: 4px solid #ffd700;
      padding-right: 10px;
    }

    .dashboard-grid,
    .grid,
    .point-box {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .dashboard-box,
    .card {
      background: #131c31;
      padding: 14px;
      border-radius: 16px;
    }

    .promo-banner {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 10px;
    }

    .offer-item {
      background: #1b2540;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .live-badge {
      background: red;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 12px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .player-list li {
      background: #1b2540;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #11182d;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">VIRO GAME</div>

  <nav>
    <a href="register.html">
      <button class="btn">تۆمارکردن</button>
    </a>

    <a href="login.html">
      <button class="btn btn-dark">چوونە ژوورەوە</button>
    </a>
  </nav>
</header>

<section class="hero">
  <h1>VIRO GAME PUBG</h1>
  <p>پلاتفۆرمی PUBG بۆ تۆڕنۆمێنت و پۆینت</p>
</section>

<div class="container">

  <section>
    <h2 class="section-title">داشبۆرد</h2>
    <div class="dashboard-grid">

      <div class="dashboard-box">
        <img class="promo-banner" src="https://images.unsplash.com/photo-1542751371-adc38448a05e">
        <p>ڕێکلام / تیم</p>
      </div>

      <div class="dashboard-box">
        <div class="offer-item">ئۆفەر 1</div>
        <div class="offer-item">ئۆفەر 2</div>
      </div>

    </div>
  </section>

  <section>
    <h2 class="section-title">PUBG</h2>
    <div class="card">
      <span class="live-badge">LIVE</span>
      <h3>PUBG Match</h3>
      <p>64 Player</p>
    </div>
  </section>

  <section>
    <h2 class="section-title">Players</h2>
    <ul class="player-list">
      <li>Player 1 <span>Online</span></li>
      <li>Player 2 <span>Online</span></li>
    </ul>
  </section>

  <section>
    <h2 class="section-title">Points</h2>
    <div class="point-box">
      <div class="offer-item">
        1000 Point
        <button class="btn">Buy</button>
      </div>
    </div>
  </section>

</div>

<footer>
VIRO GAME © 2026
</footer>

</body>
</html>
