<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چوونە ژوورەوە - VIRO GAME</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: #131c31;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    h2 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: none;
      background: #1b2540;
      color: white;
    }

    input::placeholder {
      color: #aaa;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #ffd700;
      color: black;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .link {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }

    .link a {
      color: #ffd700;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>چوونە ژوورەوە</h2>

    <input type="text" placeholder="ژمارەی مۆبایل یان ناو">
    <input type="password" placeholder="وشەی نهێنی">

    <button class="btn">چوونە ژوورەوە</button>

    <div class="link">
      هەژمار نیە؟ <a href="register.html">تۆمارکردن</a>
    </div>
  </div>

</body>
</html>
