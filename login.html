<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چوونە ژوورەوە - VIRO GAME</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .box {
      width: 90%;
      max-width: 420px;
      background: #131c31;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h2 {
      text-align: center;
      color: #ffd700;
      margin-bottom: 20px;
      font-size: 32px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      border: none;
      background: #1b2540;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #aaa;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #ffd700;
      color: black;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .message {
      text-align: center;
      margin-top: 14px;
      min-height: 24px;
      font-size: 16px;
      color: #ff6b6b;
    }

    .link {
      text-align: center;
      margin-top: 14px;
      font-size: 16px;
    }

    .link a {
      color: #ffd700;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>چوونە ژوورەوە</h2>

    <input type="email" id="email" placeholder="ئیمەیڵ">
    <input type="password" id="password" placeholder="وشەی نهێنی">

    <button class="btn" onclick="login()">چوونە ژوورەوە</button>

    <div class="message" id="message"></div>

    <div class="link">
      هەژمار نیە؟ <a href="register.html">تۆمارکردن</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://ukwucohcasssslcdvzds.supabase.co';
    const supabaseKey = 'sb_publishable_WPa170xGe956IfF9qeIxPQ_Wl6uEbnk';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      message.style.color = "#ff6b6b";
      message.textContent = "";

      if (!email || !password) {
        message.textContent = "تکایە ئیمەیڵ و وشەی نهێنی پڕ بکە";
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        message.textContent = "هەڵە: " + error.message;
        console.log(error);
      } else {
        message.style.color = "#00ff99";
        message.textContent = "بە سەرکەوتوویی چوویتە ژوورەوە";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1200);
      }
    }
  </script>

</body>
</html>
