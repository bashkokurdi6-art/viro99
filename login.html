<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body style="background:black;color:white;text-align:center;padding-top:100px;">

<h2>LOGIN</h2>

<input id="email" placeholder="email"><br><br>
<input id="password" type="password" placeholder="password"><br><br>

<button onclick="login()">LOGIN</button>

<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRjONj2ubnjWRcAudc75XyICh8KXwrX5I",
  authDomain: "viro-bdcc2.firebaseapp.com",
  projectId: "viro-bdcc2",
  storageBucket: "viro-bdcc2.firebasestorage.app",
  messagingSenderId: "532562452622",
  appId: "1:532562452622:web:e1adc471a9a78b0d3169df"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const msg = document.getElementById("msg");

window.login = async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {
    await signInWithEmailAndPassword(auth, email, password);
    msg.innerText = "LOGIN SUCCESS 🔥";
  } catch (e) {
    msg.innerText = e.message;
  }
};
</script>

</body>
</html>
