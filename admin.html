<!DOCTYPE html><html lang="ku" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07110b"><title>VERO ADMIN</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800;900&display=swap');:root{--g:#48f08b;--gold:#ffd166;--red:#ff7777;--muted:#a8c2b1;--line:rgba(135,255,177,.16)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,rgba(72,240,139,.13),transparent 35%),linear-gradient(180deg,#07110b,#030605);color:#f5fff8;font-family:'Noto Sans Arabic',Tahoma,Arial,sans-serif}button,input{font:inherit}.hidden{display:none!important}.app{width:min(100%,1150px);margin:auto;padding:16px}.glass{background:linear-gradient(145deg,rgba(17,35,24,.84),rgba(7,19,12,.78));border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 60px rgba(0,0,0,.38)}.top,.brand,.item-top,.actions{display:flex;align-items:center}.top,.item-top{justify-content:space-between}.brand{gap:10px}.logo{width:52px;height:52px;display:grid;place-items:center;background:#12301c;border-radius:17px;font-size:30px}h1{margin:0;font-size:22px}.muted{color:var(--muted);font-size:12px}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--g),#18c96b);color:#07110b}.gold{background:linear-gradient(135deg,#ffe18d,var(--gold))}.red{background:linear-gradient(135deg,#ff9b9b,var(--red));color:#2b0808}.gray{background:#203329;color:#fff}.auth{width:min(100%,440px);margin:50px auto;padding:22px}.field{margin-bottom:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#fff;outline:none}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}.stat{padding:14px 8px;text-align:center;border-radius:18px;background:rgba(20,50,31,.8);border:1px solid var(--line)}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:8px;margin-bottom:13px}.tab{white-space:nowrap;border:0;border-radius:13px;padding:9px 12px;background:rgba(255,255,255,.06);color:var(--muted);font-weight:900}.tab.active{background:var(--g);color:#07110b}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{padding:16px}.full{grid-column:1/-1}.list{display:grid;gap:10px}.item{padding:12px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07)}.actions{gap:7px;flex-wrap:wrap;margin-top:10px}.badge{padding:5px 9px;border-radius:999px;background:var(--gold);color:#07110b;font-size:11px;font-weight:900}table{width:100%;border-collapse:collapse;font-size:12px;min-width:760px}th,td{padding:9px;border-bottom:1px solid rgba(255,255,255,.07);text-align:right}.table-wrap{overflow:auto}.toast{position:fixed;right:50%;bottom:20px;transform:translateX(50%) translateY(120px);width:min(calc(100% - 28px),470px);padding:14px;border-radius:16px;background:#11251a;border:1px solid var(--line);text-align:center;z-index:999;transition:.3s;font-weight:800}.toast.show{transform:translateX(50%) translateY(0)}.toast.error{background:#351616}@media(max-width:800px){.grid2{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><section id="loginView" class="auth glass"><div class="brand" style="justify-content:center"><div class="logo">👑</div><div><h1>VERO ADMIN</h1><div class="muted">داشبۆردی ئەدمین</div></div></div><h2 style="text-align:center">چوونەژوورەوەی ئەدمین</h2><div class="field"><input id="email" type="email" placeholder="ئیمەیڵ"></div><div class="field"><input id="password" type="password" placeholder="وشەی نهێنی"></div><button class="btn" style="width:100%" onclick="login()">چوونەژوورەوە</button><button class="btn gray" style="width:100%;margin-top:9px" onclick="location.href='Vero.html'">گەڕانەوە بۆ یاری</button></section>
<main id="adminView" class="hidden"><header class="top"><div class="brand"><div class="logo">👑</div><div><h1>VERO FARM ADMIN</h1><div id="adminName" class="muted">ئەدمین</div></div></div><button class="btn red" onclick="logout()">چوونەدەرەوە</button></header><section class="stats"><div class="stat"><b id="usersCount">0</b><span>بەکارهێنەر</span></div><div class="stat"><b id="pointsTotal">0</b><span>کۆی پۆینت</span></div><div class="stat"><b id="eggsTotal">0</b><span>کۆی هێلکە</span></div><div class="stat"><b id="chickensTotal">0</b><span>کۆی مریشک</span></div><div class="stat"><b id="pendingCount">0</b><span>چاوەڕوان</span></div></section>
<nav class="tabs glass"><button class="tab active" onclick="openTab('settings',this)">ڕێکخستن</button><button class="tab" onclick="openTab('packages',this)">پاکێجەکان</button><button class="tab" onclick="openTab('requests',this)">داواکارییەکان</button><button class="tab" onclick="openTab('users',this)">بەکارهێنەران</button><button class="tab" onclick="openTab('transactions',this)">مامەڵەکان</button></nav>
<section id="tab-settings"><div class="grid2"><section class="card glass"><h3>⚙️ ڕێکخستنەکان</h3><div class="field"><label>بۆنسی دەستپێک</label><input id="signupBonus" type="number"></div><div class="field"><label>نرخی مریشک</label><input id="chickenPrice" type="number"></div><div class="field"><label>هێلکە بۆ هەر مریشک</label><input id="eggsPerChicken" type="number"></div><div class="field"><label>ماوە بە کاتژمێر</label><input id="cycleHours" type="number"></div><div class="field"><label>هێلکە بۆ ١ پۆینت</label><input id="eggsPerPoint" type="number"></div><div class="field"><label>پۆینت بۆ ١ بەڵانس</label><input id="pointsPerBalance" type="number"></div><button class="btn gold" onclick="saveSettings()">پاشەکەوتکردن</button></section><section class="card glass"><h3>🧪 تاقیکردنەوە</h3><button class="btn" onclick="setCycle(1)">ماوە = ١ کاتژمێر</button><button class="btn gray" style="margin-top:8px" onclick="setCycle(24)">ماوە = ٢٤ کاتژمێر</button></section></div></section>
<section id="tab-packages" class="hidden"><div class="grid2"><section class="card glass"><h3>➕ پاکێجی نوێ</h3><div class="field"><input id="pkgTitle" placeholder="ناوی پاکێج"></div><div class="field"><input id="pkgPoints" type="number" placeholder="پۆینت"></div><div class="field"><input id="pkgPrice" type="number" placeholder="نرخ"></div><div class="field"><input id="pkgCurrency" value="IQD"></div><button class="btn" onclick="addPackage()">زیادکردن</button></section><section class="card glass"><h3>📦 پاکێجەکان</h3><div id="packagesList" class="list"></div></section></div></section>
<section id="tab-requests" class="hidden"><section class="card glass"><h3>💎 داواکارییەکان</h3><div id="requestsList" class="list"></div></section></section>
<section id="tab-users" class="hidden"><section class="card glass"><h3>👥 بەکارهێنەران</h3><div class="table-wrap"><table><thead><tr><th>ناو</th><th>مۆبایل</th><th>پۆینت</th><th>هێلکە</th><th>بەڵانس</th><th>مریشک</th><th>دۆخ</th><th>کردار</th></tr></thead><tbody id="usersTable"></tbody></table></div></section></section>
<section id="tab-transactions" class="hidden"><section class="card glass"><h3>📜 مامەڵەکان</h3><div id="transactionsList" class="list"></div></section></section></main></div><div id="toast" class="toast"></div>
<script>
const URL='https://vhxafelyesuhpivopcni.supabase.co',KEY='sb_publishable_fMc3VhlhSEnyoCAf0DcJWQ_zTsl5tRv',db=supabase.createClient(URL,KEY);let user=null,users=[],packages=[],requests=[],transactions=[],settings=null;const $=x=>document.getElementById(x);function msg(m,e=false){const x=$('toast');x.textContent=m;x.className='toast show'+(e?' error':'');clearTimeout(window.t);window.t=setTimeout(()=>x.className='toast',2600)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function openTab(n,b){['settings','packages','requests','users','transactions'].forEach(x=>$('tab-'+x).classList.add('hidden'));$('tab-'+n).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
async function login(){const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)msg(error.message,true)}async function logout(){await db.auth.signOut()}async function guard(s){user=s?.user||null;if(!user){$('loginView').classList.remove('hidden');$('adminView').classList.add('hidden');return}const {data,error}=await db.from('profiles').select('full_name,is_admin,is_blocked').eq('id',user.id).single();if(error||!data?.is_admin||data.is_blocked){msg('دەسەڵاتی ئەدمینت نییە.',true);return db.auth.signOut()}$('adminName').textContent=data.full_name||user.email;$('loginView').classList.add('hidden');$('adminView').classList.remove('hidden');load()}
async function load(){const [s,u,p,r,t]=await Promise.all([db.from('game_settings').select('*').eq('id',1).single(),db.from('user_game_summary').select('*').order('full_name'),db.from('point_packages').select('*').order('sort_order'),db.from('point_purchase_requests').select('*').order('created_at',{ascending:false}),db.from('game_transactions').select('*').order('created_at',{ascending:false}).limit(200)]);const er=s.error||u.error||p.error||r.error||t.error;if(er){console.error(er);return msg('هەڵە لە بارکردن.',true)}settings=s.data;users=u.data||[];packages=p.data||[];requests=r.data||[];transactions=t.data||[];render()}
function render(){$('signupBonus').value=settings.signup_bonus_points;$('chickenPrice').value=settings.chicken_price_points;$('eggsPerChicken').value=settings.eggs_per_chicken;$('cycleHours').value=settings.egg_cycle_hours;$('eggsPerPoint').value=settings.eggs_per_point;$('pointsPerBalance').value=settings.points_per_balance_unit;$('usersCount').textContent=users.length;$('pointsTotal').textContent=users.reduce((s,x)=>s+Number(x.points),0).toLocaleString('en-US');$('eggsTotal').textContent=users.reduce((s,x)=>s+Number(x.eggs),0).toLocaleString('en-US');$('chickensTotal').textContent=users.reduce((s,x)=>s+Number(x.chickens_count),0).toLocaleString('en-US');$('pendingCount').textContent=requests.filter(x=>x.status==='pending').length;renderPackages();renderRequests();renderUsers();renderTransactions()}
function renderPackages(){$('packagesList').innerHTML=packages.length?packages.map(x=>`<div class="item"><div class="item-top"><strong>${esc(x.title)}</strong><span class="badge">${x.is_active?'چالاک':'ناچالاک'}</span></div><div class="muted">${x.points_amount} پۆینت • ${x.price_amount} ${esc(x.currency)}</div><div class="actions"><button class="btn gray" onclick="togglePackage('${x.id}',${!x.is_active})">${x.is_active?'ناچالاککردن':'چالاککردن'}</button><button class="btn red" onclick="deletePackage('${x.id}')">سڕینەوە</button></div></div>`).join(''):'<div class="muted">هیچ پاکێجێک نییە.</div>'}function renderRequests(){const l={pending:'چاوەڕوان',approved:'پەسەندکرا',rejected:'ڕەتکرا',cancelled:'هەڵوەشاوە'};$('requestsList').innerHTML=requests.length?requests.map(x=>`<div class="item"><div class="item-top"><strong>${esc(x.package_title)}</strong><span class="badge">${l[x.status]}</span></div><div class="muted">${x.requested_points} پۆینت • ${x.paid_amount} ${esc(x.currency)}</div>${x.status==='pending'?`<div class="actions"><button class="btn" onclick="review('${x.id}','approved')">پەسەندکردن</button><button class="btn red" onclick="review('${x.id}','rejected')">ڕەتکردنەوە</button></div>`:''}</div>`).join(''):'<div class="muted">هیچ داواکارییەک نییە.</div>'}function renderUsers(){$('usersTable').innerHTML=users.map(x=>`<tr><td>${esc(x.full_name||'بێ ناو')}${x.is_admin?' <span class="badge">ئەدمین</span>':''}</td><td>${esc(x.phone||'-')}</td><td>${x.points}</td><td>${x.eggs}</td><td>${x.game_balance}</td><td>${x.chickens_count}</td><td>${x.is_blocked?'بلۆک':'چالاک'}</td><td><button class="btn gray" onclick="manage('${x.user_id}')">بەڕێوەبردن</button></td></tr>`).join('')}function renderTransactions(){$('transactionsList').innerHTML=transactions.length?transactions.map(x=>`<div class="item"><strong>${esc(x.description||x.type)}</strong><div class="muted">${new Date(x.created_at).toLocaleString('en-US')}</div><div class="muted">پۆینت: ${x.points_change} • هێلکە: ${x.eggs_change} • بەڵانس: ${x.balance_change}</div></div>`).join(''):'<div class="muted">هیچ مامەڵەیەک نییە.</div>'}
async function saveSettings(){const payload={signup_bonus_points:Number($('signupBonus').value),chicken_price_points:Number($('chickenPrice').value),eggs_per_chicken:Number($('eggsPerChicken').value),egg_cycle_hours:Number($('cycleHours').value),eggs_per_point:Number($('eggsPerPoint').value),points_per_balance_unit:Number($('pointsPerBalance').value)};const {error}=await db.from('game_settings').update(payload).eq('id',1);if(error)return msg(error.message,true);msg('پاشەکەوتکرا.');load()}async function setCycle(h){$('cycleHours').value=h;saveSettings()}async function addPackage(){const title=$('pkgTitle').value.trim(),points=Number($('pkgPoints').value),price=Number($('pkgPrice').value),currency=$('pkgCurrency').value.trim()||'IQD';if(!title||points<=0||price<0)return msg('زانیارییەکان دروست بنووسە.',true);const {error}=await db.from('point_packages').insert({title,points_amount:points,price_amount:price,currency,sort_order:packages.length+1});if(error)return msg(error.message,true);msg('پاکێج زیادکرا.');load()}async function togglePackage(id,is_active){const {error}=await db.from('point_packages').update({is_active}).eq('id',id);if(error)return msg(error.message,true);load()}async function deletePackage(id){if(!confirm('دڵنیایت؟'))return;const {error}=await db.from('point_packages').delete().eq('id',id);if(error)return msg(error.message,true);load()}async function review(id,status){const note=prompt('تێبینی ئەدمین:','')||'';const {error}=await db.rpc('admin_review_point_purchase',{p_request_id:id,p_status:status,p_admin_note:note});if(error)return msg(error.message,true);msg('داواکاری نوێکرایەوە.');load()}
async function manage(id){const u=users.find(x=>x.user_id===id),a=prompt(`بەڕێوەبردنی ${u.full_name}\n1=پۆینت\n2=هێلکە\n3=بەڵانس\n4=بلۆک/ئەنبلۆک\n5=ئەدمین/لابردن`,'1');if(a==='1'){const v=Number(prompt('بڕی پۆینت، بۆ کەمکردن نەرێنی:','0'));if(v)adjust(id,v,0,0)}else if(a==='2'){const v=Number(prompt('بڕی هێلکە:','0'));if(v)adjust(id,0,v,0)}else if(a==='3'){const v=Number(prompt('بڕی بەڵانس:','0'));if(v)adjust(id,0,0,v)}else if(a==='4'){const {error}=await db.rpc('admin_set_user_blocked',{p_user_id:id,p_blocked:!u.is_blocked});if(error)return msg(error.message,true);load()}else if(a==='5'){const {error}=await db.rpc('admin_set_admin',{p_user_id:id,p_is_admin:!u.is_admin});if(error)return msg(error.message,true);load()}}async function adjust(id,p,e,b){const note=prompt('هۆکار:','دەستکاری ئەدمین')||'';const {error}=await db.rpc('admin_adjust_wallet',{p_user_id:id,p_points_change:p,p_eggs_change:e,p_balance_change:b,p_note:note});if(error)return msg(error.message,true);msg('باڵانس نوێکرایەوە.');load()}
db.auth.onAuthStateChange((_e,s)=>setTimeout(()=>guard(s),0));(async()=>{const {data}=await db.auth.getSession();guard(data.session)})();
</script></body></html>
