<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
  background:#0b1326;
  color:white;
  font-family:Arial;
  padding:20px;
}
.card{
  background:#151f38;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}
input{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:none;
}
button{
  width:100%;
  padding:12px;
  background:#ffd54a;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
h2{
  color:#ffd54a;
}
</style>

</head>
<body>

<div class="card">
  <h2>Room Settings</h2>

  <input id="roomEntryPrice" type="number" placeholder="Room Entry Price (مثال: 30)" />
  <input id="readyPlayers" type="number" placeholder="Ready Players" />
  <input id="totalPlayers" type="number" placeholder="Total Players" />
  <input id="roomStatus" placeholder="Room Status" />

  <button onclick="saveSettings()">Save Settings</button>
</div>

<div class="card">
  <h2>Join Requests</h2>
  <div id="joinList">Loading...</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRjONj2ubnjWRcAudc75XyICh8KXwrX5I",
  authDomain: "viro-bdcc2.firebaseapp.com",
  projectId: "viro-bdcc2",
  storageBucket: "viro-bdcc2.firebasestorage.app",
  messagingSenderId: "532562452622",
  appId: "1:532562452622:web:e1adc471a9a78b0d3169df"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ================= LOAD SETTINGS =================
async function loadSettings(){
  const ref = doc(db,"app_settings","main");
  const snap = await getDoc(ref);

  if(!snap.exists()) return;

  const data = snap.data();

  document.getElementById("roomEntryPrice").value = data.roomEntryPrice || 0;
  document.getElementById("readyPlayers").value = data.readyPlayers || 0;
  document.getElementById("totalPlayers").value = data.totalPlayers || 0;
  document.getElementById("roomStatus").value = data.roomStatus || "Open";
}

// ================= SAVE SETTINGS =================
window.saveSettings = async function(){

  await setDoc(doc(db,"app_settings","main"),{

    roomEntryPrice: Number(document.getElementById("roomEntryPrice").value || 0),
    readyPlayers: Number(document.getElementById("readyPlayers").value || 0),
    totalPlayers: Number(document.getElementById("totalPlayers").value || 0),
    roomStatus: document.getElementById("roomStatus").value

  },{merge:true});

  alert("Saved ✔");
}

// ================= LOAD JOIN REQUESTS =================
async function loadJoin(){

  const list = document.getElementById("joinList");
  list.innerHTML = "";

  const snap = await getDocs(collection(db,"room_join_requests"));

  if(snap.empty){
    list.innerHTML = "No Data";
    return;
  }

  snap.forEach(docu=>{

    const d = docu.data();

    const div = document.createElement("div");
    div.style.marginBottom="10px";
    div.style.padding="10px";
    div.style.background="#1a2747";
    div.style.borderRadius="10px";

    div.innerHTML = `
      <b>${d.username || "User"}</b><br>
      PUBG ID: ${d.pubgId || "N/A"}<br>
      Amount: $${d.amount || 0}
    `;

    list.appendChild(div);

  });
}

// ================= INIT =================
loadSettings();
loadJoin();

</script>

</body>
</html>
