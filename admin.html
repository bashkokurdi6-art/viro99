<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
  background:#0b1326;
  color:white;
  font-family:Arial;
  padding:10px;
}

h2{
  color:#ffd54a;
}

.top{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.refresh{background:#1a2747;color:white;}
.filter{background:#ffd54a;color:#111;}

.card{
  background:#151f38;
  padding:12px;
  border-radius:15px;
  margin-bottom:10px;
  border:1px solid rgba(255,255,255,.1);
}

img{
  width:120px;
  border-radius:10px;
  margin-top:5px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.approve{background:green;color:white;flex:1;}
.reject{background:red;color:white;flex:1;}

.status{
  font-size:12px;
  margin-top:5px;
}

.pending{color:orange;}
.approved{color:#7affb3;}
.rejected{color:#ff8c8c;}
</style>
</head>

<body>

<h2>Admin Panel</h2>

<div class="top">
  <button class="refresh" onclick="loadDeposits()">Refresh</button>
  <button class="filter" onclick="filterMode='all';loadDeposits()">All</button>
  <button class="filter" onclick="filterMode='pending';loadDeposits()">Pending</button>
</div>

<div id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRjONj2ubnjWRcAudc75XyICh8KXwrX5I",
  authDomain: "viro-bdcc2.firebaseapp.com",
  projectId: "viro-bdcc2",
  storageBucket: "viro-bdcc2.firebasestorage.app",
  messagingSenderId: "532562452622",
  appId: "1:532562452622:web:e1adc471a9a78b0d3169df"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");

let filterMode = "all";

async function loadDeposits(){
  list.innerHTML = "Loading...";

  const snap = await getDocs(collection(db,"deposits"));

  list.innerHTML = "";

  snap.forEach(d=>{
    const data = d.data();
    const status = data.status || "pending";

    if(filterMode==="pending" && status!=="pending") return;

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${data.username || "User"}</b><br>
      $${data.amount || 0}<br>
      ${data.method || ""}<br>

      <div class="status ${status}">
        Status: ${status}
      </div>

      ${data.imageUrl ? `<img src="${data.imageUrl}">` : ""}

      <div class="actions">
        <button class="approve" onclick="approve('${d.id}','${data.userUid}',${data.amount})">Approve</button>
        <button class="reject" onclick="reject('${d.id}')">Reject</button>
      </div>
    `;

    list.appendChild(div);
  });
}

window.approve = async (id,userUid,amount)=>{
  await updateDoc(doc(db,"deposits",id),{
    status:"approved"
  });

  await updateDoc(doc(db,"users",userUid),{
    balance: increment(Number(amount))
  });

  alert("Approved ✅");
  loadDeposits();
};

window.reject = async (id)=>{
  await updateDoc(doc(db,"deposits",id),{
    status:"rejected"
  });

  alert("Rejected ❌");
  loadDeposits();
};

loadDeposits();

</script>

</body>
</html>
